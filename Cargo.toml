[workspace]
resolver = "2"
members = ["crates/fea-dg", "crates/fea-wasm", "crates/nlsn-delaunay"]

# `fea-dg` is its own repository, so it declares the mesher as a git dependency
# in order to build standalone. Inside this workspace that must resolve to the
# submodule checkout instead: the submodule is the version this repo pins and
# tests against, and without the patch a local mesher change would be invisible
# to the solver until it was pushed.
[patch."https://github.com/gitnlsn/nlsn-delaunay-refine"]
nlsn-delaunay = { path = "crates/nlsn-delaunay" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Keep debug builds of the mesher usable interactively; the refinement loop is
# far too slow to drive a UI slider at opt-level 0.
[profile.dev.package."*"]
opt-level = 2
