[package]
name = "fea-wasm"
version = "0.1.0"
edition = "2021"
description = "wasm-bindgen surface over the nlsn-delaunay mesher, for the browser FEA tool."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1"
nlsn-delaunay = { path = "../nlsn-delaunay" }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"
