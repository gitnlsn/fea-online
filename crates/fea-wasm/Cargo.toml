[package]
name = "fea-wasm"
version = "0.1.0"
edition = "2021"
description = "wasm-bindgen surface over the nlsn-delaunay mesher, for the browser FEA tool."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1"
# The solver declares the mesher as a git dependency so it builds standalone;
# the workspace `[patch]` redirects that to `../nlsn-delaunay`, so both crates
# below resolve to the same checkout and `FlatMesh` is one type, not two.
fea-dg = { path = "../fea-dg" }
# Only for `Float32Array`: the transient path returns a frame of a few hundred
# thousand floats sixty times a run, and serde-wasm-bindgen would box every one
# of them into a JavaScript `Array` rather than a typed array.
js-sys = "0.3"
nlsn-delaunay = { path = "../nlsn-delaunay" }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"

[dev-dependencies]
# Only to pin the JSON shape of the tagged request enums against what the web
# app emits. Nothing in the shipped wasm parses JSON.
serde_json = "1"
wasm-bindgen-test = "0.3"
